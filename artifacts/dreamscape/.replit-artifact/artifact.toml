kind = "mobile"
previewPath = "/"
title = "DreamScape AI"
version = "1.0.0"
id = "artifacts/dreamscape"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22882

[services.development]
run = "pnpm --filter @workspace/dreamscape run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dreamscape", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/dreamscape", "run", "serve" ]

[services.env]
PORT = "22882"
BASE_PATH = "/"
